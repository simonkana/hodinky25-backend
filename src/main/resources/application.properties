# Spring Application
spring.application.name=hodinky25-backend
# Console Output
spring.output.ansi.enabled=always
# Datasource
spring.datasource.url=jdbc:mysql://localhost:3306/hodinky25
spring.datasource.username=hodinky25
spring.datasource.password=your_secure_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
# Server port
server.port=8080
# JWT
jwt.secret=your_jwt_secret
# Logging
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG
# Client URLs
client.next-js-dev-url=http://localhost:3000
client.vite-dev-url=http://localhost:5173
